<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Projek JKN Perlis 2026</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#22d3ee">
  <link rel="apple-touch-icon" href="./logo.png">
  <link rel="icon" type="image/png" href="./logo.png">
  
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f8f9fa; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  
  <!-- TAMPAL URL GOOGLE SCRIPT ANDA DI BAWAH -->
  <iframe src="https://script.google.com/macros/s/AKfycbwC3GFJ4JiWa8qtFJ5no6ackejMGxbv4oIkrvtmvgd5icbq24LdPQLH0VBW9rxqB1r8Fg/exec"></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker didaftarkan!', reg))
          .catch(err => console.log('Service Worker gagal:', err));
      });
    }
  </script>
</body>
</html>
